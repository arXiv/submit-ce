# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Cache the fastText language model
      uses: actions/cache@v4
      with:
        path: ~/.cache/fasttext-langdetect
        key: fasttext-lid.176.bin

    - name: Test with pytest
      env:
        FTLANG_CACHE: ~/.cache/fasttext-langdetect
      run: |
        # Fetch the model once, so the parallel workers don't all download it.
        uv run python -c "from ftlangdetect.detect import download_model; download_model('lid.176.bin')"
        # Much of the coverage settings are in pyproject.toml
        uv run pytest -n auto \
        --cov=submit_ce --cov-report=term-missing \
        --ignore=submit_ce/implementations/pubsub

    - name: Ruff lint check
      run: |
        # ruff is pinned in the dev dependency group installed by uv sync above.
        uv run ruff check --output-format=github submit_ce
      continue-on-error: true
